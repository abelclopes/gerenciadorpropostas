services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=gerenciadorPropostas;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=true"
      ASPNETCORE_URLS: "http://0.0.0.0:8484"
    ports:
      - "${APP_PORT}:8484"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_public}"
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}.tls=true"
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.${APP_NAME}-${ENVIRONMENT}.loadbalancer.server.port=8484"
    networks:
      - default
      - traefik_public

  frontend:
    build:
      context: .
      dockerfile: cliente-react/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "8332:80"
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_public}"
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}-front.rule=Host(`${FRONTEND_HOST}`)"
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}-front.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}-front.tls=true"
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}-front.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.${APP_NAME}-${ENVIRONMENT}-front.loadbalancer.server.port=80"
    networks:
      - default
      - traefik_public

volumes:
  sqlserver_data:

networks:
  traefik_public:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_public}
