stages:
  - test
  - deploy

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  GIT_DEPTH: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

api_test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - cd serverApi
    - dotnet restore serverApi.sln
    - dotnet build serverApi.sln -c Release --no-restore
    - dotnet test serverApi.sln -c Release --no-build
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

frontend_build:
  stage: test
  image: node:20-alpine
  script:
    - cd cliente-react
    - npm ci
    - npm run build
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.deploy_lab_core:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash openssh-client rsync
    - : "${LAB_CORE_HOST:?LAB_CORE_HOST nao definido}"
    - : "${LAB_CORE_USER:?LAB_CORE_USER nao definido}"
    - : "${LAB_CORE_SSH_PRIVATE_KEY:?LAB_CORE_SSH_PRIVATE_KEY nao definida}"
    - eval "$(ssh-agent -s)"
    - printf '%s\n' "$LAB_CORE_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -p "${LAB_CORE_PORT:-22}" -H "${LAB_CORE_HOST}" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ./scripts/deploy-lab-core.sh

deploy_lab_core_develop:
  extends: .deploy_lab_core
  variables:
    DEPLOY_ENV: develop
    LAB_CORE_DEPLOY_PATH: /home/abel/apps/gerenciadorpropostas/develop
  environment:
    name: lab-core/develop
    url: https://gerenciadorpropostas.develop.devops.abellinux.com
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

deploy_lab_core_homolog:
  extends: .deploy_lab_core
  variables:
    DEPLOY_ENV: homolog
    LAB_CORE_DEPLOY_PATH: /home/abel/apps/gerenciadorpropostas/homolog
  environment:
    name: lab-core/homolog
    url: https://gerenciadorpropostas.homolog.devops.abellinux.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: manual
